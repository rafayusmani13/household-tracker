<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7f4"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Hydration</title></head>
<body><main class="wrap">
<header><div><p class="eyebrow">HOUSEHOLD TRACKER</p><h1>Hydration</h1></div><button class="iconbtn" onclick="refresh()" aria-label="Refresh">↻</button></header>
<div id="notice" class="notice" hidden></div>
<section class="people">
<article class="person"><div class="personhead"><h2>You</h2><span id="you-percent">—</span></div><div class="bottle"><div id="you-water" class="water"></div><div class="bottlemark"></div></div><div class="amount"><strong id="you-total">0</strong><span>oz</span></div><p class="muted">Goal: <span id="you-goal">100</span> oz · Bottle: 24 oz</p><button onclick="manual({type:'hydration',person:'You',ounces:24})">Log +24 oz</button><div class="quick"><button class="secondary" onclick="manual({type:'hydration',person:'You',ounces:12})">+12 oz</button><button class="secondary" onclick="manual({type:'hydration',person:'You',ounces:24})">+24 oz</button></div></article>
<article class="person"><div class="personhead"><h2>Wife</h2><span id="wife-percent">—</span></div><div class="bottle"><div id="wife-water" class="water"></div><div class="bottlemark"></div></div><div class="amount"><strong id="wife-total">0</strong><span>oz</span></div><p class="muted">Goal: <span id="wife-goal">80</span> oz · Bottle: 32 oz</p><button onclick="manual({type:'hydration',person:'Wife',ounces:32})">Log +32 oz</button><div class="quick"><button class="secondary" onclick="manual({type:'hydration',person:'Wife',ounces:16})">+16 oz</button><button class="secondary" onclick="manual({type:'hydration',person:'Wife',ounces:32})">+32 oz</button></div></article>
</section>
<section class="panel"><div class="sectionhead"><h2>Today's activity</h2><span id="today"></span></div><div id="activity" class="activity"><p class="muted">Loading…</p></div></section>
<footer>Shared household hydration · <button class="textbtn" onclick="refresh()">Refresh totals</button></footer>
</main><script src="config.js"></script><script src="common.js"></script><script>
function render(d){const h=d.hydration;["You","Wife"].forEach(w=>{const x=h[w],pct=Math.min(100,Math.round(x.total/x.goal*100));document.getElementById(w.toLowerCase()+"-total").textContent=x.total;document.getElementById(w.toLowerCase()+"-goal").textContent=x.goal;document.getElementById(w.toLowerCase()+"-percent").textContent=pct+"%";document.getElementById(w.toLowerCase()+"-water").style.height=pct+"%";});document.getElementById("today").textContent=d.date;document.getElementById("activity").innerHTML=h.recent.length?h.recent.map(x=>`<div class="event"><span>${x.person} · ${fmtTime(x.timestamp)}</span><strong>+${x.ounces} oz</strong></div>`).join(""):'<p class="muted">No drinks logged yet today.</p>';}
refresh();setInterval(refresh,60000);
</script></body></html>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
